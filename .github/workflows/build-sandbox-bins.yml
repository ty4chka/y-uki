name: Build Sandbox Binaries (linux-x86_64)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release --bin yukic --bin yukino --bin yukino-lsp
          mkdir -p dist
          cp target/release/yukic dist/
          cp target/release/yukino dist/
          cp target/release/yukino-lsp dist/
          chmod +x dist/*
          tar -czf yukino-linux-x86_64.tar.gz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sandbox-bins
          name: Sandbox Binaries (linux-x86_64)
          files: yukino-linux-x86_64.tar.gz
          make_latest: false
